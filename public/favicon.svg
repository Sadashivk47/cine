<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc0d1c"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#050505"/>

  <!-- Film strip -->
  <rect x="10" y="10" width="44" height="44" rx="8" fill="url(#bg)"/>

  <!-- Film holes -->
  <circle cx="16" cy="18" r="2" fill="#050505"/>
  <circle cx="16" cy="32" r="2" fill="#050505"/>
  <circle cx="16" cy="46" r="2" fill="#050505"/>

  <circle cx="48" cy="18" r="2" fill="#050505"/>
  <circle cx="48" cy="32" r="2" fill="#050505"/>
  <circle cx="48" cy="46" r="2" fill="#050505"/>

  <!-- Play button -->
  <polygon points="27,22 27,42 43,32" fill="white"/>
</svg>
